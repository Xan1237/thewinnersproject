# G1 sim arena: one decision model (Jev) drives every robot; a different frontier LLM orchestrates
# it in each robot. All calls go through OpenRouter. The orchestrators are what the arena compares.
# 1. Start the sim + viewer:  cd ../arena && npm run dev        (viewer http://127.0.0.1:8820)
# 2. Export the key (never put it in this file):  export OPENROUTER_API_KEY=...
# 3. python -m winners.pipeline --config configs/g1_arena.yaml --out runs/g1-live
#    (or just the arena: python -m winners.arena --config configs/g1_arena.yaml --out runs/g1-live)
env:
  type: g1-sim
  base_url: "http://127.0.0.1:8818"
  max_steps: 110

run:
  tasks: ["talk"]    # the shared scenario: grab a coffee, then find a free seat
  episodes: 3
  seed0: 0
  max_steps: 110

train:
  teachers: null             # null = learn from every model's successful runs
  # Top up the few slow LLM runs with cheap scripted runs on a separate sim server (data farm):
  #   SIM_PORT=8819 node ../arena/server/server.js
  extra_base_url: "http://127.0.0.1:8819"
  extra_episodes: 25
  extra_policies:
    - {type: scripted-goto, name: scripted-precise, noise: 0.03}
    - {type: scripted-goto, name: scripted-sloppy, noise: 0.15}
  epochs: 150
  epoch_delay_s: 0.08
  eval_episodes: 4
  eval_pace_s: 0.35          # play the learned policy back in real time in the viewer

# Same decision model for everyone (verified live 2026-10-11: typesafe/jev-1.13, ~0.2 s per decision,
# POST /api/alpha/decisions). Only the orchestrator differs. Orchestrators run with reasoning on
# "low": Opus, Fable, Astra, Grok and Gemini refuse to switch it off.
policies:
  - type: jev
    name: fable-5.1
    orchestrator: "anthropic/claude-fable-5.1"
    orchestrator_extra_body: {reasoning: {effort: low}}
    price_in: 10.0
    price_out: 50.0

  - type: jev
    name: gpt-6-astra
    orchestrator: "openai/gpt-6-astra"
    orchestrator_extra_body: {reasoning: {effort: low}}
    price_in: 10.0
    price_out: 50.0

  - type: jev
    name: opus-5.5
    orchestrator: "anthropic/claude-opus-5.5"
    orchestrator_extra_body: {reasoning: {effort: low}}
    price_in: 4.0
    price_out: 20.0

  - type: jev
    name: grok-4.7
    orchestrator: "x-ai/grok-4.7"
    orchestrator_extra_body: {reasoning: {effort: low}}
    price_in: 2.0
    price_out: 6.0

  - type: jev
    name: gemini-3.1-pro
    orchestrator: "google/gemini-3.1-pro-preview"
    orchestrator_extra_body: {reasoning: {effort: low}}
    price_in: 2.0
    price_out: 12.0

  - type: jev
    name: kimi-k3
    orchestrator: "moonshotai/kimi-k3"
    orchestrator_extra_body: {reasoning: {effort: low}}
    price_in: 0.8
    price_out: 13.5

  - type: jev
    name: qwen-3.8-27b
    orchestrator: "qwen/qwen3.8-27b"
    # Qwen only ever runs on Cerebras (pinned: no other provider, no fallback)
    orchestrator_extra_body: {reasoning: {enabled: false}, provider: {only: ["cerebras"], allow_fallbacks: false}}
    price_in: 0.04
    price_out: 2.3

# `python -m winners.show`: robots that never stop (see winners/show.py)
show:
  pause_s: 3                # a robot stands still this long after finishing a routine
  hold_after_order_s: 12    # ... and this long after a spoken order, so the room can see it
  bootstrap_episodes: 6     # scripted runs per routine on the data farm before the first training
  first_round_wins: 10      # frontier wins needed before the first training round
  retrain_every_wins: 25    # then retrain after this many new frontier wins
